name: PulseAI News Ingestion & Multi-LLM Synthesis

on:
  schedule:
    - cron: '0 * * * *' # Runs every 1 hour (60 minutes)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Ingestion Script with LLM Fallbacks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/ingest_news.js
