name: PulseAI News Ingestion & Multi-LLM Synthesis (Python)

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every 1 hour (60 minutes)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  ingest_news_python:
    name: Run Python News Ingestion & AI Synthesis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Python News Ingestion Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/ingest_news.py
